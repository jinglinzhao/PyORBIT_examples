inputs:
  RVdata_expres:
    file: /work2/lbuc/iara/GitHub/PyORBIT_examples/ESSP4/data/DS8_expres_RV.dat
    kind: RV
    models:
      - radial_velocities
      - gp_multidimensional
  RVdata_harps:
    file: /work2/lbuc/iara/GitHub/PyORBIT_examples/ESSP4/data/DS8_harps_RV.dat
    kind: RV
    models:
      - radial_velocities
      - gp_multidimensional
  RVdata_neid:
    file: /work2/lbuc/iara/GitHub/PyORBIT_examples/ESSP4/data/DS8_neid_RV.dat
    kind: RV
    models:
      - radial_velocities
      - gp_multidimensional
  FWHMdata_expres:
    file: /work2/lbuc/iara/GitHub/PyORBIT_examples/ESSP4/data/DS8_expres_FWHM.dat
    kind: FWHM
    models:
      - gp_multidimensional
  FWHMdata_harps:
    file: /work2/lbuc/iara/GitHub/PyORBIT_examples/ESSP4/data/DS8_harps_FWHM.dat
    kind: FWHM
    models:
      - gp_multidimensional
  FWHMdata_neid:
    file: /work2/lbuc/iara/GitHub/PyORBIT_examples/ESSP4/data/DS8_neid_FWHM.dat
    kind: FWHM
    models:
      - gp_multidimensional
  Contrastdata_expres:
    file: /work2/lbuc/iara/GitHub/PyORBIT_examples/ESSP4/data/DS8_expres_Contrast.dat
    kind: Contrast
    models:
      - gp_multidimensional
  Contrastdata_harps:
    file: /work2/lbuc/iara/GitHub/PyORBIT_examples/ESSP4/data/DS8_harps_Contrast.dat
    kind: Contrast
    models:
      - gp_multidimensional
  Contrastdata_neid:
    file: /work2/lbuc/iara/GitHub/PyORBIT_examples/ESSP4/data/DS8_neid_Contrast.dat
    kind: Contrast
    models:
      - gp_multidimensional

common:
  planets:
    b:
      orbit: keplerian
      parametrization: Eastman2013
      boundaries:
        P: [1.3, 100.0]
        K: [0.001, 10.0]
        e: [0.00, 0.70]
      priors:
        e: ['Gaussian', 0.00, 0.098]
    c:
      orbit: keplerian
      parametrization: Eastman2013
      boundaries:
        P: [1.3, 100.0]
        K: [0.001, 10.0]
        e: [0.00, 0.70]
      priors:
        e: ['Gaussian', 0.00, 0.098]
  activity:
    boundaries:
      Prot: [20.0, 35.0]
      Pdec: [30.0, 1000.0]
      Oamp: [0.01, 1.0]
    priors:
      Prot: ['Gaussian', 28.00, 0.50]
      Oamp: ['Gaussian', 0.35, 0.035]
  star:
    star_parameters:
      priors:
        mass: ['Gaussian', 1, 0.000001]
        radius: ['Gaussian', 1, 0.000001]
        density: ['Gaussian', 1, 0.000001]

models:
  radial_velocities:
    planets:
      - b
      - c
  gp_multidimensional:
    model: spleaf_multidimensional_esp
    common: activity
    n_harmonics: 4
    hyperparameters_condition: True
    rotation_decay_condition: True
    RVdata_expres:
      boundaries:
        rot_amp: [0.0, 10.0] #at least one must be positive definite
        con_amp: [-20.0, 20.0]
      derivative: True
    RVdata_harps:
      boundaries:
        rot_amp: [0.0, 10.0] #at least one must be positive definite
        con_amp: [-20.0, 20.0]
      derivative: True
    RVdata_neid:
      boundaries:
        rot_amp: [0.0, 10.0] #at least one must be positive definite
        con_amp: [-20.0, 20.0]
      derivative: True
    FWHMdata_expres:
      boundaries:
        rot_amp: [-10.0, 10.0]
        con_amp: [-20.0, 20.0]
      derivative: True
    FWHMdata_harps:
      boundaries:
        rot_amp: [-10.0, 10.0]
        con_amp: [-20.0, 20.0]
      derivative: True
    FWHMdata_neid:
      boundaries:
        rot_amp: [-10.0, 10.0]
        con_amp: [-20.0, 20.0]
      derivative: True
    Contrastdata_expres:
      boundaries:
        rot_amp: [-10.0, 10.0]
        con_amp: [-20.0, 20.0]
      derivative: True
    Contrastdata_harps:
      boundaries:
        rot_amp: [-10.0, 10.0]
        con_amp: [-20.0, 20.0]
      derivative: True
    Contrastdata_neid:
      boundaries:
        rot_amp: [-10.0, 10.0]
        con_amp: [-20.0, 20.0]
      derivative: True

parameters:
  Tref: 59334.700184
  low_ram_plot: True
  plot_split_threshold: 1000
  cpu_threads: 16

solver:
  pyde:
    ngen: 50000
    npop_mult: 4
  emcee:
    npop_mult: 4
    nsteps: 50000
    nburn: 15000
    nsave: 15000
    thin: 150
    #use_threading_pool: False
  nested_sampling:
    nlive: 1000
    sampling_efficiency: 0.30
  recenter_bounds: True
