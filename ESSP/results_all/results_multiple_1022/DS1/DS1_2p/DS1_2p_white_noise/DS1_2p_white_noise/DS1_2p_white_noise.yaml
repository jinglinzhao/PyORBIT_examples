inputs:
  RVdata_expres:
    file: /work2/lbuc/iara/GitHub/PyORBIT_examples/ESSP4/data/DS1_expres_RV.dat
    kind: RV
    models:
      - radial_velocities
  RVdata_harps:
    file: /work2/lbuc/iara/GitHub/PyORBIT_examples/ESSP4/data/DS1_harps_RV.dat
    kind: RV
    models:
      - radial_velocities
  RVdata_neid:
    file: /work2/lbuc/iara/GitHub/PyORBIT_examples/ESSP4/data/DS1_neid_RV.dat
    kind: RV
    models:
      - radial_velocities

common:
  planets:
    b:
      orbit: keplerian
      parametrization: Eastman2013
      boundaries:
        P: [1.3, 100.0]
        K: [0.001, 10.0]
        e: [0.00, 0.70]
      priors:
        e: ['Gaussian', 0.00, 0.098]
    c:
      orbit: keplerian
      parametrization: Eastman2013
      boundaries:
        P: [1.3, 100.0]
        K: [0.001, 10.0]
        e: [0.00, 0.70]
      priors:
        e: ['Gaussian', 0.00, 0.098]
  star:
    star_parameters:
      priors:
        mass: ['Gaussian', 1, 0.000001]
        radius: ['Gaussian', 1, 0.000001]
        density: ['Gaussian', 1, 0.000001]

models:
  radial_velocities:
    planets:
      - b
      - c

parameters:
  Tref: 59334.700184
  low_ram_plot: True
  plot_split_threshold: 1000
  cpu_threads: 16

solver:
  pyde:
    ngen: 50000
    npop_mult: 4
  emcee:
    npop_mult: 4
    nsteps: 50000
    nburn: 15000
    nsave: 15000
    thin: 150
    #use_threading_pool: False
  nested_sampling:
    nlive: 1000
    sampling_efficiency: 0.30
  recenter_bounds: True
